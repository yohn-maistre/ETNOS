<title>Peta Pengetahuan ETNOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* Layout: a full-height map with a reading panel on the right (stacked below on phones). Ink-print: paper ground, ink dots, hairline threads. */
:root{
  --paper:#eceee8; --ink:#1d2320; --muted:#5d6660; --line:#c9cec6; --panel:#f5f6f2;
  --mee:#a8701c; --sai:#2d6b78; --lap:#55762c; --shared:#4a4f63; --mark:#1d2320;
  --serif:"Newsreader",Georgia,serif; --sans:"Geist",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121513;--ink:#e3e6df;--muted:#98a199;--line:#2b312d;--panel:#181c19;--mee:#d39b45;--sai:#5fa3b1;--lap:#8fb25f;--shared:#9aa0b8;--mark:#e3e6df;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121513;--ink:#e3e6df;--muted:#98a199;--line:#2b312d;--panel:#181c19;--mee:#d39b45;--sai:#5fa3b1;--lap:#8fb25f;--shared:#9aa0b8;--mark:#e3e6df;color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans)}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100%}
.stage{position:relative;min-width:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
.top{position:absolute;inset:0 0 auto 0;padding:18px max(16px,env(safe-area-inset-left,0px)) 0;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-start;pointer-events:none}
.top>*{pointer-events:auto}
h1{font:400 34px/1.05 var(--serif);margin:0;letter-spacing:-.01em;text-wrap:balance;flex:1 1 260px}
h1 small{display:block;font:400 13px/1.4 var(--sans);color:var(--muted);margin-top:6px;letter-spacing:0;max-width:46ch}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:2px}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--sai);outline-offset:2px}
.btn{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;background:var(--panel)}
#q{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--panel);color:var(--ink);width:170px}
.axis{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;font:12px var(--mono);color:var(--muted);pointer-events:none}
.tip{position:absolute;pointer-events:none;max-width:300px;background:var(--panel);border:1px solid var(--line);padding:8px 10px;font-size:12.5px;line-height:1.4;border-radius:6px;box-shadow:0 4px 18px rgb(0 0 0/.08)}
.tip b{display:block;font-weight:500}
.tip span{color:var(--muted)}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 28px 20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.counts div{display:flex;flex-direction:column}
.counts strong{font:400 26px/1 var(--serif);font-variant-numeric:tabular-nums}
.counts span{font-size:12px;color:var(--muted)}
.label{font:500 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.legend{display:grid;gap:5px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:50%;flex:none}
.shape{width:14px;display:inline-flex;justify-content:center;flex:none}
.detail h2{font:400 22px/1.2 var(--serif);margin:0 0 4px;text-wrap:balance}
.detail .meta{font:12px var(--mono);color:var(--muted);margin-bottom:8px;word-break:break-word}
.detail p{margin:0 0 10px}
.detail a{color:var(--sai)}
.trace{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.trace li{border-left:2px solid var(--line);padding:2px 0 2px 10px;font-size:13px;cursor:pointer}
.trace li:hover{border-color:var(--ink)}
.trace li small{display:block;color:var(--muted);font-size:11.5px}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
.pill{display:inline-block;font:500 11px var(--sans);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin:0 4px 4px 0;color:var(--muted)}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:68vh auto;height:auto}aside{border-left:0;border-top:1px solid var(--line)}h1{font-size:26px}}
</style>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="c" aria-label="Peta tiga dimensi: setiap titik adalah halaman, kalimat sumber, atau sumber"></canvas>
    <div class="top">
      <h1>Peta Pengetahuan<small>Mee Pago, Saireri dan La Pago dalam satu peta. Setiap titik adalah halaman wiki, kalimat sumber yang sudah diperiksa, atau sumber yang tercatat.</small></h1>
      <div class="controls">
        <div class="seg" role="group" aria-label="Susunan">
          <button id="mMakna" aria-pressed="true">Makna</button>
          <button id="mWaktu" aria-pressed="false">Lapisan waktu</button>
        </div>
        <div class="seg" role="group" aria-label="Warna">
          <button id="cReg" aria-pressed="true">Wilayah</button>
          <button id="cKind" aria-pressed="false">Jenis</button>
        </div>
        <input id="q" type="search" placeholder="Cari: Paniai, sagu, 1938…" aria-label="Cari titik">
        <button class="btn" id="spin">Jeda putar</button>
      </div>
    </div>
    <div class="axis" id="axis"></div>
    <div class="tip" id="tip" hidden></div>
  </div>
  <aside>
    <div class="counts" id="counts"></div>
    <div><p class="label">Wilayah</p><div class="legend" id="legReg"></div></div>
    <div><p class="label">Titik</p><div class="legend" id="legKind"></div></div>
    <div class="detail" id="detail"></div>
    <p class="note" id="note"></p>
  </aside>
</div>
<script>
const DATA = __DATA__;
const N = DATA.nodes, E = DATA.edges;
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const REG = { meepago: ['Mee Pago', '--mee'], saireri: ['Saireri', '--sai'], 'la-pago': ['La Pago', '--lap'], shared: ['Lebih dari satu wilayah', '--shared'] };
const KIND = { region: 'Wilayah adat', page: 'Halaman wiki', passage: 'Kalimat sumber (terverifikasi)', source: 'Sumber yang dikutip', catalogue: 'Sumber tercatat (katalog)' };
const KCOL = { region: '--ink', page: '--sai', passage: '--muted', source: '--mee', catalogue: '--lap' };
const SIZE = { region: 7, page: 4.2, source: 3.4, catalogue: 3.2, passage: 1.6 };
const adj = N.map(() => []);
E.forEach(([a, b, k], i) => { adj[a].push([b, k, i]); adj[b].push([a, k, i]); });
// Time layout: x/z from meaning, height from the year a source was written. Undated sit in the top band.
const years = N.map((n) => n.y).filter(Boolean), Y0 = Math.min(...years), Y1 = 2026;
const yH = (y) => (y ? -0.95 + 1.7 * ((y - Y0) / (Y1 - Y0)) : 1.0);
N.forEach((n) => { n.m = n.p; n.w = [n.p[0], -yH(n.y) + (n.y ? 0 : (n.p[1]) * 0.08), n.p[2]]; n.c = n.p.slice(); });
// A region sits at the centre of its pages, so the three regions read apart.
N.forEach((n, i) => { if (n.k !== 'region') return; const ps = adj[i].map(([j]) => N[j]).filter((m) => m.k === 'page'); if (!ps.length) return; for (const key of ['m', 'w']) n[key] = [0, 1, 2].map((d) => ps.reduce((s, m) => s + m[key][d], 0) / ps.length); n.c = n.m.slice(); });
let mode = 'makna', colorBy = 'reg', rotY = 0.6, rotX = 0.28, zoom = 1, spinning = !matchMedia('(prefers-reduced-motion: reduce)').matches, sel = -1, hover = -1, query = '';
const cvs = $('c'), ctx = cvs.getContext('2d');
let W = 0, H = 0, dpr = 1, proj = [];
function resize() { const r = cvs.getBoundingClientRect(); dpr = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; cvs.width = W * dpr; cvs.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
addEventListener('resize', () => { resize(); draw(); });
function colorOf(n) { return css(colorBy === 'reg' ? REG[n.reg][1] : KCOL[n.k]); }
function matches(n) { if (!query) return true; const q = query.toLowerCase(); return (n.t + ' ' + (n.x || '') + ' ' + (n.a || '') + ' ' + (n.y || '')).toLowerCase().includes(q); }
function project() {
  const s = Math.min(W, H) * 0.36 * zoom, cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX), ox = W * 0.5, oy = H * (mode === 'waktu' ? 0.6 : 0.56);
  proj = N.map((n, i) => { const [x, y, z] = n.c; const x1 = x * cy + z * sy, z1 = -x * sy + z * cy; const y1 = y * cx - z1 * sx, z2 = y * sx + z1 * cx; const f = 3.2 / (3.2 + z2); return [ox + x1 * s * f, oy + y1 * s * f, z2, f, i]; });
}
function linked(i) { const s = new Set([i]); adj[i].forEach(([j]) => s.add(j)); return s; }
function draw() {
  project(); ctx.clearRect(0, 0, W, H);
  const focus = sel >= 0 ? linked(sel) : null, hit = query ? new Set(N.map((n, i) => (matches(n) ? i : -1)).filter((i) => i >= 0)) : null;
  // Threads: faint for all, strong for the selection.
  ctx.lineWidth = 0.5; ctx.strokeStyle = css('--line');
  ctx.globalAlpha = focus || hit ? 0.25 : 0.55; ctx.beginPath();
  for (const [a, b, k] of E) { if (k === 'from') continue; const A = proj[a], B = proj[b]; ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); }
  ctx.stroke(); ctx.globalAlpha = 1;
  if (focus) { ctx.lineWidth = 1; ctx.strokeStyle = css('--ink'); ctx.beginPath(); for (const [j] of adj[sel]) { const A = proj[sel], B = proj[j]; ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); } ctx.stroke(); }
  const order = proj.slice().sort((a, b) => b[2] - a[2]);
  for (const [x, y, z, f, i] of order) {
    const n = N[i], dim = (focus && !focus.has(i)) || (hit && !hit.has(i));
    const r = SIZE[n.k] * (0.7 + 0.5 * f) * (i === sel || i === hover ? 1.7 : 1);
    ctx.globalAlpha = dim ? 0.12 : Math.max(0.35, Math.min(1, 0.55 + 0.4 * f));
    const col = colorOf(n); ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 1.1;
    ctx.beginPath();
    if (n.k === 'source') { ctx.rect(x - r, y - r, r * 2, r * 2); ctx.fill(); }
    else if (n.k === 'catalogue') { ctx.moveTo(x, y - r * 1.2); ctx.lineTo(x + r * 1.2, y); ctx.lineTo(x, y + r * 1.2); ctx.lineTo(x - r * 1.2, y); ctx.closePath(); n.sens === 'sacred' || n.sens === 'restricted' ? ctx.stroke() : ctx.fill(); }
    else if (n.k === 'region') { ctx.arc(x, y, r, 0, 7); ctx.lineWidth = 2; ctx.stroke(); ctx.beginPath(); ctx.arc(x, y, r * 0.35, 0, 7); ctx.fill(); }
    else { ctx.arc(x, y, r, 0, 7); ctx.fill(); }
    if (n.sens === 'conflict' && !dim) { ctx.beginPath(); ctx.strokeStyle = css('--mark'); ctx.lineWidth = 0.8; ctx.arc(x, y, r * 2, 0, 7); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  // Labels for regions and the selection.
  ctx.font = '500 12px ' + css('--sans').split(',')[0]; ctx.fillStyle = css('--ink'); ctx.textBaseline = 'middle';
  N.forEach((n, i) => { if (n.k === 'region' || i === sel) { const [x, y] = proj[i]; ctx.fillText(n.k === 'region' ? REG[n.reg][0] : short(n.t, 40), x + 11, y); } });
  $('axis').textContent = mode === 'waktu' ? `Bawah ${Y0} · atas ${Y1}. Titik tanpa tahun (termasuk Wikipedia) di lapisan teratas.` : 'Jarak = kemiripan teks, bukan kategori budaya.';
}
const short = (t, n) => (t.length > n ? t.slice(0, n - 1) + '…' : t);
// Motion: ease between layouts, slow rotation.
let tween = 0;
function setMode(m) { mode = m; $('mMakna').setAttribute('aria-pressed', m === 'makna'); $('mWaktu').setAttribute('aria-pressed', m === 'waktu'); if (m === 'waktu') { rotX = 0.05; } tween = 1; }
function tick() {
  if (tween > 0) { tween = Math.max(0, tween - 0.04); const t = 1 - tween, e = t * t * (3 - 2 * t); N.forEach((n) => { const to = mode === 'makna' ? n.m : n.w; n.c = n.c.map((v, d) => v + (to[d] - v) * e * 0.35); }); if (tween === 0) N.forEach((n) => (n.c = (mode === 'makna' ? n.m : n.w).slice())); }
  if (spinning && !drag) rotY += 0.0018;
  draw(); requestAnimationFrame(tick);
}
// Pointer: drag to turn, wheel or pinch to zoom, hover to read, tap to trace.
let drag = null, moved = 0; const pts = new Map();
cvs.addEventListener('pointerdown', (e) => { cvs.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); drag = [e.clientX, e.clientY]; moved = 0; cvs.classList.add('drag'); });
cvs.addEventListener('pointermove', (e) => {
  if (pts.size === 2 && pts.has(e.pointerId)) { const [a, b] = [...pts.values()]; const d0 = Math.hypot(a[0] - b[0], a[1] - b[1]); pts.set(e.pointerId, [e.clientX, e.clientY]); const [c, d] = [...pts.values()]; zoom = Math.max(0.5, Math.min(5, zoom * Math.hypot(c[0] - d[0], c[1] - d[1]) / d0)); return; }
  if (drag) { const dx = e.clientX - drag[0], dy = e.clientY - drag[1]; moved += Math.abs(dx) + Math.abs(dy); rotY += dx * 0.006; rotX = Math.max(-1.4, Math.min(1.4, rotX + dy * 0.006)); drag = [e.clientX, e.clientY]; pts.set(e.pointerId, drag); return; }
  const r = cvs.getBoundingClientRect(); hover = pick(e.clientX - r.left, e.clientY - r.top); showTip(hover, e.clientX - r.left, e.clientY - r.top);
});
const end = (e) => { pts.delete(e.pointerId); if (drag && moved < 6) { const r = cvs.getBoundingClientRect(); select(pick(e.clientX - r.left, e.clientY - r.top)); } drag = pts.size ? [...pts.values()][0] : null; cvs.classList.remove('drag'); };
cvs.addEventListener('pointerup', end); cvs.addEventListener('pointercancel', end);
cvs.addEventListener('pointerleave', () => { hover = -1; $('tip').hidden = true; });
cvs.addEventListener('wheel', (e) => { e.preventDefault(); zoom = Math.max(0.5, Math.min(5, zoom * Math.exp(-e.deltaY * 0.0015))); }, { passive: false });
function pick(x, y) { let best = -1, bd = 14; for (const [px, py, z, f, i] of proj) { const d = Math.hypot(px - x, py - y) - (N[i].k === 'passage' ? 0 : 3); if (d < bd) { bd = d; best = i; } } return best; }
function showTip(i, x, y) { const t = $('tip'); if (i < 0) { t.hidden = true; return; } const n = N[i]; t.innerHTML = `<b>${esc(short(n.t, 140))}</b><span>${KIND[n.k]}${n.y ? ' · ' + n.y : ''}${n.k === 'passage' ? ' · ' + esc(short(n.x, 60)) : ''}</span>`; t.hidden = false; t.style.left = Math.min(x + 14, W - 310) + 'px'; t.style.top = y + 14 + 'px'; }
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function select(i) {
  sel = i; const d = $('detail'); if (i < 0) { d.innerHTML = '<p class="label">Pilih titik</p><p>Ketuk titik untuk melihat dari mana pengetahuannya datang: halaman, kalimat yang dipakai, sumbernya, dan sumber lain yang tercatat.</p>'; return; }
  const n = N[i], nb = adj[i].map(([j, k]) => [j, k]);
  const group = (kind) => nb.filter(([j]) => N[j].k === kind);
  let h = `<p class="label">${KIND[n.k]} · ${REG[n.reg][0]}</p><h2>${esc(n.k === 'passage' ? '“' + short(n.t, 200) + '”' : n.t)}</h2>`;
  const meta = [n.a, n.y, n.kind, n.acc && 'akses: ' + n.acc].filter(Boolean).join(' · '); if (meta) h += `<div class="meta">${esc(meta)}</div>`;
  if (n.sens && n.sens !== 'none') h += `<span class="pill">${{ conflict: 'konflik', sacred: 'sakral: dicatat subjeknya saja', restricted: 'terbatas', personal: 'pribadi' }[n.sens]}</span>`;
  if (n.k === 'passage') h += `<p class="meta">Dari: ${esc(n.x)}</p>`; else if (n.x && n.k !== 'region') h += `<p>${esc(short(n.x, 420))}</p>`;
  if (n.u) h += `<p><a href="${esc(n.u)}" target="_blank" rel="noreferrer">Buka sumber</a></p>`;
  const list = (title, items, sub) => items.length ? `<p class="label">${title} · ${items.length}</p><ul class="trace">${items.slice(0, 14).map(([j]) => `<li data-i="${j}">${esc(short(N[j].t, 120))}<small>${esc(sub(N[j]))}</small></li>`).join('')}</ul>` : '';
  h += list('Bersandar pada kalimat', group('passage'), (m) => short(m.x, 70));
  h += list('Halaman', group('page'), (m) => REG[m.reg][0]);
  h += list('Sumber yang dikutip', group('source'), (m) => m.x);
  h += list('Sumber lain yang tercatat', group('catalogue'), (m) => [m.a, m.y, m.acc].filter(Boolean).join(' · '));
  if (n.k === 'page') { const ys = group('catalogue').map(([j]) => N[j].y).filter(Boolean); h += `<p class="meta">Sumber tercatat paling awal: ${ys.length ? Math.min(...ys) : 'belum ditemukan'}</p>`; }
  d.innerHTML = h; d.querySelectorAll('li[data-i]').forEach((li) => li.addEventListener('click', () => select(+li.dataset.i)));
}
$('mMakna').onclick = () => setMode('makna'); $('mWaktu').onclick = () => setMode('waktu');
$('cReg').onclick = () => { colorBy = 'reg'; $('cReg').setAttribute('aria-pressed', true); $('cKind').setAttribute('aria-pressed', false); };
$('cKind').onclick = () => { colorBy = 'kind'; $('cKind').setAttribute('aria-pressed', true); $('cReg').setAttribute('aria-pressed', false); };
$('spin').onclick = () => { spinning = !spinning; $('spin').textContent = spinning ? 'Jeda putar' : 'Putar'; };
$('spin').textContent = spinning ? 'Jeda putar' : 'Putar';
$('q').oninput = (e) => (query = e.target.value.trim());
const cnt = (k) => N.filter((n) => n.k === k).length, wiki = N.filter((n) => n.k === 'source' && /wikipedia/.test(n.u || '')).length;
$('counts').innerHTML = [[cnt('page'), 'halaman wiki'], [cnt('passage'), 'kalimat terverifikasi'], [cnt('source'), 'sumber dikutip, ' + wiki + ' Wikipedia'], [cnt('catalogue'), 'sumber tercatat']].map(([v, l]) => `<div><strong>${v}</strong><span>${l}</span></div>`).join('');
$('legReg').innerHTML = Object.entries(REG).map(([, [l, v]]) => `<div><span class="sw" style="background:var(${v})"></span>${l}</div>`).join('');
$('legKind').innerHTML = [['●', 'Halaman wiki'], ['·', 'Kalimat sumber'], ['■', 'Sumber yang dikutip'], ['◆', 'Sumber tercatat'], ['◇', 'Materi sakral: dicatat subjeknya saja'], ['◯', 'Melingkar: catatan konflik']].map(([s, l]) => `<div><span class="shape">${s}</span>${l}</div>`).join('');
const early = Math.min(...N.filter((n) => n.k === 'catalogue' && n.y).map((n) => n.y));
$('note').textContent = `Prototipe, ${DATA.built}. Hampir semua kalimat datang dari Wikipedia. Sumber tercatat (paling awal ${early}) belum dibaca isinya, baru dicatat. Letak titik dihitung dari kemiripan teks (${DATA.model}); kedekatan bukan kategori budaya.`;
resize(); select(N.findIndex((n) => n.k === 'page' && n.slug === 'mee')); requestAnimationFrame(tick);
</script>
