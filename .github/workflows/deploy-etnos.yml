name: Deploy ETNOS
# Runs the same checks as a local release, then deploys the web profile.
# Deploys on manual dispatch, or when deploy/etnos.txt changes on main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [deploy/etnos.txt]
permissions:
  contents: read
concurrency:
  group: deploy-etnos
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix apps/web --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run check:worker
      - run: npm run build:ui
      # Model settings come from repository variables (Settings → Secrets and variables → Actions → Variables):
      # STRATA_MODEL_FAST is the model name, e.g. a Gemini model from Google AI Studio. Without it the node stays on
      # keyless Workers AI. The base URL defaults to Google AI Studio's OpenAI-compatible endpoint.
      - run: |
          set -- --config wrangler.web.jsonc
          if [ -n "$STRATA_MODEL_FAST" ]; then
            set -- "$@" --var "STRATA_MODEL_FAST:$STRATA_MODEL_FAST" --var "STRATA_MODEL_BASE_URL:${STRATA_MODEL_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}"
            if [ -n "$STRATA_MODEL_SYNTHESIS" ]; then set -- "$@" --var "STRATA_MODEL_SYNTHESIS:$STRATA_MODEL_SYNTHESIS"; fi
            if [ -n "$STRATA_RESIDENT_DAILY_CALLS" ]; then set -- "$@" --var "STRATA_RESIDENT_DAILY_CALLS:$STRATA_RESIDENT_DAILY_CALLS"; fi
          fi
          # Sign-up through the ETNOS identity host appears only when the owner sets STRATA_ACCOUNT_HOST
          # (an https origin). Its host name is added to the OAuth allowlist with it.
          if [ -n "$STRATA_ACCOUNT_HOST" ]; then
            hosts=$(node -e 'const t=require("fs").readFileSync("wrangler.web.jsonc","utf8");console.log(/"STRATA_OAUTH_HOSTS":\s*"([^"]*)"/.exec(t)[1])')
            set -- "$@" --var "STRATA_ACCOUNT_HOST:$STRATA_ACCOUNT_HOST" --var "STRATA_OAUTH_HOSTS:$hosts,$(node -e 'console.log(new URL(process.argv[1]).hostname)' "$STRATA_ACCOUNT_HOST")"
          fi
          npx wrangler deploy "$@"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRATA_MODEL_FAST: ${{ vars.STRATA_MODEL_FAST }}
          STRATA_MODEL_SYNTHESIS: ${{ vars.STRATA_MODEL_SYNTHESIS }}
          STRATA_MODEL_BASE_URL: ${{ vars.STRATA_MODEL_BASE_URL }}
          STRATA_RESIDENT_DAILY_CALLS: ${{ vars.STRATA_RESIDENT_DAILY_CALLS }}
          # The identity host on workers.dev (owner decision, 19 November); a repository variable overrides it.
          STRATA_ACCOUNT_HOST: ${{ vars.STRATA_ACCOUNT_HOST || 'https://etnos-identity-host.giyaibo.workers.dev' }}
      # The model key (Settings → Secrets and variables → Actions → Secrets: STRATA_MODEL_KEY). Kept as a Worker secret.
      - name: Pass the model key to the Worker
        if: ${{ env.STRATA_MODEL_KEY != '' }}
        run: printf '%s' "$STRATA_MODEL_KEY" | npx wrangler secret put STRATA_MODEL_KEY --config wrangler.web.jsonc
        env:
          STRATA_MODEL_KEY: ${{ secrets.STRATA_MODEL_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional: the literature panel stays hidden without this key.
      - name: Pass the OpenAlex key to the Worker
        if: ${{ env.OPENALEX_API_KEY != '' }}
        run: printf '%s' "$OPENALEX_API_KEY" | npx wrangler secret put OPENALEX_API_KEY --config wrangler.web.jsonc
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # The multi-account identity host (packages/pds), on workers.dev, with sign-up closed until the owner
  # approves DNS, the escrow key and PLC writes (packages/pds/wrangler.host.jsonc). Its failure does
  # not hold back the ETNOS deploy above.
  identity-host:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/pds
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - name: Work out the host name
        id: host
        run: |
          host="$PDS_HOSTNAME"
          if [ -z "$host" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).result.subdomain))')
            host="etnos-identity-host.$sub.workers.dev"
          fi
          echo "name=$host" >> "$GITHUB_OUTPUT"
        env:
          PDS_HOSTNAME: ${{ vars.STRATA_PDS_HOSTNAME }}
      # Escrow key, PLC writes, the operator token hash and the blob bucket are public values in
      # wrangler.host.jsonc, so the repository is the one place to read them.
      - name: Deploy
        run: npx wrangler deploy --config wrangler.host.jsonc --var "PDS_HOSTNAME:${{ steps.host.outputs.name }}"
      # The key-encryption key (ACCOUNT_KEK_V1) wraps every account key, so a lost or replaced KEK loses
      # those keys (the owner's escrow key can still rotate each DID to a new key). This step never
      # replaces it. It is made only on the very first deploy, when the Worker has neither the KEK nor
      # the operator token; if the operator token exists without a KEK, the step stops instead, because
      # that means the KEK was removed by hand. The secret list must parse, or nothing is written.
      # A repository secret STRATA_PDS_KEK is used for that first KEK if present.
      - name: Secrets
        shell: bash
        run: |
          set -euo pipefail
          list=$(npx wrangler secret list --config wrangler.host.jsonc --format json)
          names=$(printf '%s' "$list" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);if(!Array.isArray(a))process.exit(3);console.log(a.map(x=>x.name).join(" "))})')
          case " $names " in
            *" ACCOUNT_KEK_V1 "*) echo "ACCOUNT_KEK_V1 exists and is left as it is." ;;
            *" OPERATOR_TOKEN "*) echo "::error::OPERATOR_TOKEN exists but ACCOUNT_KEK_V1 does not. Not creating a new KEK; restore the old one by hand."; exit 1 ;;
            *)
              if [ -n "$KEK" ]; then printf '%s' "$KEK"; else node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("base64url"))'; fi | npx wrangler secret put ACCOUNT_KEK_V1 --config wrangler.host.jsonc ;;
          esac
          if [ -n "$OPERATOR" ]; then printf '%s' "$OPERATOR" | npx wrangler secret put OPERATOR_TOKEN --config wrangler.host.jsonc
          else case " $names " in *" OPERATOR_TOKEN "*) ;; *) node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("base64url"))' | npx wrangler secret put OPERATOR_TOKEN --config wrangler.host.jsonc ;; esac
          fi
        env:
          KEK: ${{ secrets.STRATA_PDS_KEK }}
          OPERATOR: ${{ secrets.STRATA_PDS_OPERATOR_TOKEN }}
      # Handles <name>.etnos.space resolve over HTTPS at /.well-known/atproto-did. That needs a proxied
      # wildcard DNS record (*.etnos.space AAAA 100::) and a Worker route for that path. Both are made
      # only when missing. Names that already have their own record keep it: a wildcard record never
      # applies to a name that has a record. Their resolution is printed before and after as a check.
      - name: Handle names under etnos.space
        shell: bash
        run: |
          set -uo pipefail
          api=https://api.cloudflare.com/client/v4
          get() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api$1"; }
          post() { curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' "$api$1" --data "$2"; }
          status() { curl -sS -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$1&type=A" | jq -r '.Status'; }
          zone=$(get "/zones?name=$DOMAIN" | jq -r '.result[0].id // empty')
          if [ -z "$zone" ]; then echo "::warning::The API token cannot read the zone $DOMAIN. Handles need the record *.$DOMAIN AAAA 100:: (proxied) and the route *.$DOMAIN/.well-known/atproto-did."; exit 0; fi
          records=$(get "/zones/$zone/dns_records?per_page=500")
          if [ "$(printf '%s' "$records" | jq -r '.success')" != "true" ]; then echo "::warning::The API token cannot list DNS records: $(printf '%s' "$records" | jq -c '.errors')"; fi
          names=$(printf '%s' "$records" | jq -r '.result[]? | select(.name | startswith("*") | not) | .name' | sort -u)
          before=""; for n in $names; do before="$before $n:$(status "$n")"; done
          echo "Before:$before"
          if printf '%s' "$records" | jq -e --arg n "*.$DOMAIN" '[.result[]? | select(.name == $n)] | length > 0' >/dev/null; then
            echo "The wildcard record exists."
          else
            r=$(post "/zones/$zone/dns_records" '{"type":"AAAA","name":"*","content":"100::","proxied":true,"ttl":1,"comment":"ETNOS identity host: handle names"}')
            echo "Wildcard record: $(printf '%s' "$r" | jq -c '{success, errors}')"
          fi
          routes=$(get "/zones/$zone/workers/routes")
          if printf '%s' "$routes" | jq -e --arg p "*.$DOMAIN/.well-known/atproto-did" '[.result[]? | select(.pattern == $p)] | length > 0' >/dev/null; then
            echo "The route exists."
          else
            r=$(post "/zones/$zone/workers/routes" "{\"pattern\":\"*.$DOMAIN/.well-known/atproto-did\",\"script\":\"etnos-identity-host\"}")
            echo "Route: $(printf '%s' "$r" | jq -c '{success, errors}')"
          fi
          # Situs at <name>.etnos.space: every other path on a subdomain goes to the web Worker, whose
          # dispatcher serves a published Situs or answers 404 (ETNOS_SITUS_SUBDOMAINS in wrangler.web.jsonc).
          # The handle route above is more specific, so it keeps winning for /.well-known/atproto-did.
          if printf '%s' "$routes" | jq -e --arg p "*.$DOMAIN/*" '[.result[]? | select(.pattern == $p)] | length > 0' >/dev/null; then
            echo "The Situs route exists."
          else
            r=$(post "/zones/$zone/workers/routes" "{\"pattern\":\"*.$DOMAIN/*\",\"script\":\"strata-preview\"}")
            echo "Situs route: $(printf '%s' "$r" | jq -c '{success, errors}')"
          fi
          sleep 5
          after=""; for n in $names; do after="$after $n:$(status "$n")"; done
          echo "After:$after"
          if [ "$before" != "$after" ]; then echo "::error::An existing name changed how it resolves."; exit 1; fi
        env:
          DOMAIN: etnos.space
      # CPU per request over the last 24 hours, from the GraphQL Analytics API: the Worker itself and
      # each Durable Object namespace (sign-in checks the password inside the account object). Counts
      # and times only; nothing about any account. Needs Account Analytics Read on the token.
      - name: CPU over the last day
        shell: bash
        continue-on-error: true
        run: |
          from=$(date -u -d '-24 hours' +%FT%TZ); to=$(date -u +%FT%TZ)
          q='query($a:String!,$f:Time!,$t:Time!){viewer{accounts(filter:{accountTag:$a}){
            w:workersInvocationsAdaptive(limit:10,filter:{scriptName:"etnos-identity-host",datetime_geq:$f,datetime_leq:$t}){sum{requests errors}quantiles{cpuTimeP50 cpuTimeP90 cpuTimeP99}dimensions{status}}
            d:durableObjectsPeriodicGroups(limit:100,filter:{datetime_geq:$f,datetime_leq:$t}){sum{cpuTime activeTime exceededCpuErrors}dimensions{namespaceId}}
            i:durableObjectsInvocationsAdaptiveGroups(limit:100,filter:{scriptName:"etnos-identity-host",datetime_geq:$f,datetime_leq:$t}){sum{requests errors}quantiles{wallTimeP50 wallTimeP99}dimensions{namespaceId}}}}}'
          body=$(jq -n --arg q "$q" --arg a "$CLOUDFLARE_ACCOUNT_ID" --arg f "$from" --arg t "$to" '{query:$q,variables:{a:$a,f:$f,t:$t}}')
          r=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' https://api.cloudflare.com/client/v4/graphql --data "$body")
          printf '%s' "$r" | jq -c '.errors // empty'
          printf '%s' "$r" | jq -c '.data.viewer.accounts[0].w[]? | {status:.dimensions.status, requests:.sum.requests, errors:.sum.errors, cpuMicros:.quantiles}'
          ns=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/durable_objects/namespaces?per_page=100" | jq -c '[.result[]? | select(.script == "etnos-identity-host") | {id, class}]')
          printf '%s' "$r" | jq -c --argjson ns "${ns:-[]}" '.data.viewer.accounts[0] as $x | $ns[] as $n | {class:$n.class, cpuMicros:([$x.d[]? | select(.dimensions.namespaceId == $n.id) | .sum.cpuTime] | add), exceededCpu:([$x.d[]? | select(.dimensions.namespaceId == $n.id) | .sum.exceededCpuErrors] | add), requests:([$x.i[]? | select(.dimensions.namespaceId == $n.id) | .sum.requests] | add), wall:([$x.i[]? | select(.dimensions.namespaceId == $n.id) | .quantiles] | first)} | select(.requests != null) | . + {cpuMicrosPerRequest: ((.cpuMicros // 0) / .requests | floor)}'
      - name: Check it answers
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://${{ steps.host.outputs.name }}/health"; then echo; exit 0; fi
            sleep 10
          done
          exit 1
